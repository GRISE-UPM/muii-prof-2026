# Servidor
# server.address: el microservicio solo acepta conexiones de la propia maquina (el servicio de eventos).
server.port=8082
server.address=127.0.0.1

# Amazon SES
# El remitente tiene que ser una identidad verificada en SES y, mientras la cuenta este en el
# sandbox, el destinatario tambien debe estarlo.
correos.remitente=no-reply@eventhub.example
spring.cloud.aws.region.static=us-east-1

# OpenAPI / Swagger UI: desactivado en produccion. Se habilita con el perfil 'dev'.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
