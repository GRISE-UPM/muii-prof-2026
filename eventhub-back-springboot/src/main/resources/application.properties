# Servidor
# Obligatorio: sin cognito.properties (cognito.sh) ni el secreto prod/aurora/admin (secrets.sh) la aplicacion no arranca.
spring.config.import=classpath:cognito.properties,aws-secretsmanager:/prod/aurora/admin
server.port=8080

# PostgreSQL: username, password, host, port y dbname salen del secreto creado por secrets.sh.
spring.datasource.username=${username}
spring.datasource.password=${password}
spring.datasource.url=jdbc:postgresql://${host}:${port}/${dbname}

# JPA / Hibernate (Generación automática del esquema)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# OpenAPI / Swagger UI: desactivado en produccion. Se habilita con el perfil 'dev'.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
