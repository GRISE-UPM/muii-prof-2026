# Servidor
# Obligatorio: sin cognito.properties (cognito.sh) ni aurora.properties (aurora.sh) la aplicacion no arranca.
spring.config.import=classpath:cognito.properties,classpath:aurora.properties
server.port=8080

# Aurora PostgreSQL: username, password, host, port y dbname salen del secreto que crea Aurora.
# dbname tiene valor por defecto por si el secreto gestionado por RDS no incluye esa clave.
spring.datasource.username=${username}
spring.datasource.password=${password}
spring.datasource.url=jdbc:postgresql://${host}:${port}/${dbname:eventhub}

# JPA / Hibernate (Generación automática del esquema)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# OpenAPI / Swagger UI: desactivado en produccion. Se habilita con el perfil 'dev'.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
