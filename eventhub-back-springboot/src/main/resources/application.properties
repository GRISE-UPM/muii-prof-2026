# Servidor
# Obligatorio: sin cognito.properties (cognito.sh) la aplicacion no arranca.
spring.config.import=classpath:cognito.properties
server.port=8080

# JPA / Hibernate (Generación automática del esquema)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# OpenAPI / Swagger UI: desactivado en produccion. Se habilita con el perfil 'dev'.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Consola H2: desactivada en produccion. Se habilita con el perfil 'dev'.
spring.h2.console.enabled=false
#---
spring.config.activate.on-profile=!dev
# Aurora: en todos los perfiles salvo 'dev', que usa H2 en memoria (application-dev.properties).
# Obligatorio fuera de 'dev': sin aurora.properties (aurora.sh) la aplicacion no arranca.
spring.config.import=classpath:aurora.properties

# Aurora PostgreSQL: username, password, host, port y dbname salen del secreto que crea Aurora.
# dbname tiene valor por defecto por si el secreto gestionado por RDS no incluye esa clave.
spring.datasource.username=${username}
spring.datasource.password=${password}
spring.datasource.url=jdbc:postgresql://${host}:${port}/${dbname:eventhub}
