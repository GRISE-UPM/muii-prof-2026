# Servidor
# Obligatorio: sin cognito.properties (cognito.sh) ni el secreto prod/h2/admin (secrets.sh) la aplicacion no arranca.
spring.config.import=classpath:cognito.properties,aws-secretsmanager:prod/h2/admin
server.port=8080

# Base de Datos H2: username, password y dbname salen del secreto creado por secrets.sh.
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${username}
spring.datasource.password=${password}
spring.datasource.url=jdbc:h2:mem:${dbname};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Consola H2: desactivada en produccion. Se habilita con el perfil 'dev'.
spring.h2.console.enabled=false

# JPA / Hibernate (Generación automática del esquema)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# OpenAPI / Swagger UI: desactivado en produccion. Se habilita con el perfil 'dev'.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
