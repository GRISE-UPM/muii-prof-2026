# Servidor
# Obligatorio: sin cognito.properties (cognito.sh) la aplicacion no arranca.
spring.config.import=classpath:cognito.properties
server.port=8080

# JPA / Hibernate (Generación automática del esquema)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# OpenAPI / Swagger UI: desactivado en produccion. Se habilita con el perfil 'dev'.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Consola H2: desactivada en produccion. Se habilita con el perfil 'dev'.
spring.h2.console.enabled=false
#---
spring.config.activate.on-profile=!dev
# Aurora: en todos los perfiles salvo 'dev', que usa H2 en memoria (application-dev.properties).
# Obligatorio fuera de 'dev': sin aurora.properties (aurora.sh) la aplicacion no arranca.
spring.config.import=classpath:aurora.properties

# Aurora PostgreSQL: username y password salen del secreto que crea Aurora.
# aurora.host, aurora.port y aurora.dbname los escribe aurora.sh en aurora.properties.
# Driver JDBC de AWS. Plugins:
#   readWriteSplitting: las transacciones readOnly van a una réplica
#   failover2, efm2: detectan la caída del writer y reconectan al nuevo sin esperar al DNS
spring.datasource.username=${username}
spring.datasource.password=${password}
spring.datasource.driver-class-name=software.amazon.jdbc.Driver
spring.datasource.url=jdbc:aws-wrapper:postgresql://${aurora.host}:${aurora.port}/${aurora.dbname}?wrapperPlugins=readWriteSplitting,failover2,efm2
