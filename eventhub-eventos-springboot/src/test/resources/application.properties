# Tests: H2 en memoria. No se importa el secreto de Aurora.
spring.config.import=classpath:cognito.properties
server.port=8080

spring.datasource.url=jdbc:h2:mem:eventhubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Los tests no levantan pagos ni correos: los clientes se sustituyen por dobles y estas URLs
# solo existen para que los beans se puedan construir.
servicios.pagos.url=http://127.0.0.1:8081
servicios.correos.url=http://127.0.0.1:8082
servicios.espera-conexion=2s
servicios.espera-lectura=5s

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
