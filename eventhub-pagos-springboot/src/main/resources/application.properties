# Servidor
# server.address: el microservicio solo acepta conexiones de la propia maquina (el servicio de eventos).
server.port=8081
server.address=127.0.0.1

# Pasarela de cobro simulada: probabilidad de que el cargo se deniegue (0.0 nunca, 1.0 siempre).
pagos.probabilidad-fallo=0.2

# OpenAPI / Swagger UI: desactivado en produccion. Se habilita con el perfil 'dev'.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
